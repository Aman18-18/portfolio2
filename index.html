<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Aman Singh — Full Stack Developer</title>
    <meta
      name="description"
      content="Aman Singh — Full Stack Developer portfolio featuring projects, technical skills, experience, and software development work."
    />
    <meta
      name="keywords"
      content="Aman Singh, Full Stack Developer, Software Developer, React Developer, TypeScript Developer, C++ Developer, Web Developer, Portfolio"
    />
    <meta name="author" content="Aman Singh" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Aman Singh — Full Stack Developer" />
    <meta
      property="og:description"
      content="Explore Aman Singh's projects, technical skills, experience, and work as a Full Stack Developer."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hero-banner-poster.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aman Singh — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Explore Aman Singh's projects, technical skills, experience, and work as a Full Stack Developer."
    />
    <meta name="twitter:image" content="/hero-banner-poster.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark" ? stored : "dark";

          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
